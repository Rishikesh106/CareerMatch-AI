services:
  postgres:
    image: postgres:16-alpine
    container_name: careermatch_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-careermatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careermatch_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careermatch_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/careermatch
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-careermatch_ai_super_secret_jwt_key_for_development_2026_xyz}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY:-careermatch_ai_super_refresh_jwt_key_for_development_2026_abc}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careermatch_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
